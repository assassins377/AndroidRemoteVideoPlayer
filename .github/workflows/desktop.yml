name: Desktop (Linux)
on:
  push:
    branches: [main]
  pull_request:
  # Tag builds are run by release.yml after the Android job has created the draft (one draft, no race).
  workflow_call:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y fakeroot file
      - run: ./gradlew --no-daemon :desktop:test :desktop:packageDeb :desktop:packageAppImage
      - name: Package (.deb deps, tar.gz, AppImage)
        run: |
          DEB=$(ls desktop/build/compose/binaries/main/deb/*.deb)
          V=$(dpkg-deb -f "$DEB" Version | cut -d- -f1)
          bash desktop/packaging/patch-deb.sh "$DEB"
          mkdir -p dist && cp "$DEB" dist/
          tar -C desktop/build/compose/binaries/main/app -czf dist/remote-video-player-$V-linux-x64.tar.gz remote-video-player
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          bash desktop/packaging/build-appimage.sh "$PWD/appimagetool" "$V" dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - name: Attach to release draft (created if missing)
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # release.yml creates the draft first; fall back to creating it only if none exists (drafts are found via list).
          if ! gh release list --limit 50 --json tagName -q '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Linux desktop build"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
