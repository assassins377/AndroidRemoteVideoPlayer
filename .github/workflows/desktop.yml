name: Desktop (Linux)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y fakeroot
      - run: ./gradlew --no-daemon :desktop:test :desktop:packageDeb :desktop:packageAppImage
      - name: tar.gz with launcher
        run: |
          V=$(ls desktop/build/compose/binaries/main/deb/*.deb | sed -E 's/.*_([0-9.]+)-.*/\1/')
          tar -C desktop/build/compose/binaries/main/app -czf remote-video-player-$V-linux-x64.tar.gz remote-video-player
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            remote-video-player-*-linux-x64.tar.gz
      - name: Attach to release draft
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "$GITHUB_REF_NAME" desktop/build/compose/binaries/main/deb/*.deb remote-video-player-*-linux-x64.tar.gz --clobber
