name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK (R8 + shrinkResources)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Verify signature and rename
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "AndroidRemoteVideoPlayer-${GITHUB_REF_NAME#v}-release.apk"
      - name: Draft GitHub Release (single draft; Linux job attaches to it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list --limit 50 --json tagName -q '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            gh release upload "$GITHUB_REF_NAME" AndroidRemoteVideoPlayer-*-release.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" AndroidRemoteVideoPlayer-*-release.apk \
              --draft --title "$GITHUB_REF_NAME" --notes "См. CHANGELOG.md"
          fi
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # Linux desktop artifacts, attached to the same draft after it exists.
  linux:
    needs: release
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: write
